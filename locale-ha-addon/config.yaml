# Home Assistant Supervisor add-on manifest (HAOS / Supervised path).
#
# Uses the prebuilt multi-arch image published to GHCR by CI — "same
# image, two paths" (the other path is ../deploy/docker-compose.yaml).
# Supervisor pulls `image` + ":{version}" rather than building from the
# Dockerfile.
#
# This file is the contract Supervisor reads. The release workflow
# (.github/workflows/release.yml, tag v*) stamps `version` from the tag
# and publishes this directory (config.yaml, DOCS.md, plus a CHANGELOG.md
# generated from the release tags) into the public locale-homeassistant
# repo, which doubles as the
# Supervisor add-on store (repository.yaml at its root) alongside its
# HACS role. `version` here stays "0.0.0" in source — the tag is the
# single source of truth.
name: Locale
slug: locale_ha_addon
version: "0.8.4"
description: >-
  Locale hub for Home Assistant — holds the platform connection and HA's
  signing key, discovers Locale devices on the LAN, serves them time, and
  bridges them to the Locale Home Assistant integration.
url: "https://github.com/locale-systems/locale-ha-addon"

# Supervisor expands {arch} and appends ":{version}". Per-arch image repos
# (aarch64-…, amd64-…) are the HA add-on convention; the release workflow
# publishes them (plus the multi-arch manifest the compose path uses).
image: "ghcr.io/locale-systems/{arch}-locale-ha-addon"
arch:
  - aarch64
  - amd64

init: false

# mDNS discovery + serving SNTP to LAN devices need L2 reach.
host_network: true

# Setup UI via Supervisor ingress (docs/addon-pairing.md §4): the SAME
# minimal /pair page a standalone install reaches by hostname, here a
# sidebar panel with HA-admin auth for free — no host/port/path to type.
# ingress_port is the UI port the add-on serves (ADDON_UI_ADDR, default
# :8088); keep it free on the host (host_network). Setup-only page — this
# is the only Supervisor coupling, and it is benign.
ingress: true
ingress_port: 8088
panel_icon: mdi:link-variant
panel_title: Locale Pairing

# Supervisor discovery (Workstream C, docs/addon-pairing.md §7): the add-on
# publishes a private discovery message offering the integration its host/port
# + API token, so the HAOS/Supervised user pastes nothing. UNVERIFIED on a live
# Supervisor — the integration also discovers via zeroconf (_locale-addon._tcp)
# and the manual host/port/token path remains. The `service` is the
# integration's domain.
discovery:
  - locale

# Supervisor delivers these as /data/options.json; config.Load reads that
# file directly and overlays it on the env defaults (no entrypoint shim).
# SUPERVISOR_TOKEN is injected as env regardless, so token-mode detection
# works independently.
#
# Two rules, enforced by internal/config's manifest tests:
#   - Features are gated by the *_enabled booleans, never by whether a
#     value is set. Blanking an endpoint means "use the default", not
#     "disable" (that used to be the documented disable path — it isn't
#     any more).
#   - Every option's default below is exactly what config.Load() resolves
#     with no overrides, and the endpoint defaults equal the
#     build-injectable values in internal/defaults. This block is what
#     the HA config page displays.
#
# Order is the HA config-page render order: each switch sits above the
# value(s) it governs. Every schema entry stays optional ("?") — required
# keys can fail Supervisor's validation of an existing install's saved
# options on update; the Go side defaults every absent key anyway.
options:
  log_level: info
  ota_enabled: true
  platform_url: "https://api.localesystems.com"
  remote_access_enabled: true
  platform_mux_addr: "mux.localesystems.com:9443"
  telemetry_forward: true
  telemetry_retention_days: 7
  ntp_provision_enabled: true
  sntp_advertise: ""
schema:
  log_level: "list(debug|info|warn|error)?"
  # ota_enabled: the firmware/OTA surface. Off = firmware reads report
  #   installed-only and installs are rejected; the platform registry is
  #   never contacted.
  ota_enabled: "bool?"
  # platform_url: Locale cloud base URL. Defaults to the Locale cloud
  #   so firmware/OTA works out of the box — override only for
  #   dev/self-host. The add-on mints a device-scoped provision token
  #   from it (same open mechanism iOS uses) and reads the firmware
  #   registry; no platform credential is stored here or in the
  #   integration. Blank = the default; ota_enabled is the off switch.
  platform_url: "str?"
  # remote_access_enabled: the cloud tunnel (remote tier). Off = the
  #   add-on never dials the platform's mux ingress; telemetry
  #   forwarding, which rides the tunnel, stops too. Firmware/OTA is
  #   independent.
  remote_access_enabled: "bool?"
  # platform_mux_addr: the platform's LMUX ingress endpoint (host:port) —
  #   the raw-TLS mux port the add-on dials for its persistent cloud tunnel
  #   (roster registration + remote entity/management requests),
  #   authenticated by its role:ha carrier identity. Defaults to the
  #   production ingress so remote access works out of the box — the
  #   tunnel is inert until the Home is enrolled anyway. Override only
  #   for dev/self-host. Blank = the default; remote_access_enabled is
  #   the off switch.
  platform_mux_addr: "str?"
  # telemetry_forward: send stored device telemetry to the Locale cloud over
  #   the add-on's cloud tunnel. Set false to keep telemetry entirely local —
  #   the add-on keeps recording to disk either way, and turning it back on
  #   resumes from where it left off rather than skipping the gap.
  telemetry_forward: "bool?"
  # telemetry_retention_days: how long device telemetry is kept on disk. The
  #   local log is append-only and nothing else reclaims it, so without a
  #   limit it grows for the life of the install. 0 keeps everything forever —
  #   choose that deliberately (e.g. you intend to archive locally), not by
  #   accident.
  telemetry_retention_days: "int(0,)?"
  # ntp_provision_enabled: point adopted devices at this add-on as their
  #   time source — the add-on provisions each adopted device's
  #   ntp_server (the Internet-Disabled tier's clock). Off = devices keep
  #   their own NTP config.
  ntp_provision_enabled: "bool?"
  # sntp_advertise: override for the advertised ntp_server value
  #   (host:port), e.g. "192.168.1.10:1123". Use the HA host's LAN
  #   address (the DEVICE dials it), not localhost. Blank = derived from
  #   the host's LAN IP + the SNTP port; set it only when the derivation
  #   picks the wrong interface (multi-NIC hosts). Only used while
  #   ntp_provision_enabled is on.
  sntp_advertise: "str?"
