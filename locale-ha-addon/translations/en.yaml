configuration:
  log_level:
    name: Log level
    description: Add-on logging verbosity.
  sntp_advertise:
    name: NTP advertise (host:port)
    description: >-
      Point adopted devices at this add-on as their NTP server, e.g.
      "192.168.1.10:1123" — the HA host's LAN address, since the device
      dials it (not localhost). Leave blank to not manage the device's NTP.
      The recommended value for your network is printed in the add-on Log at
      startup.
  platform_url:
    name: Platform URL
    description: >-
      Locale cloud base URL for firmware/OTA. Defaults to the Locale cloud;
      override only for dev/self-host, or leave blank to disable OTA.
  platform_mux_addr:
    name: Remote access endpoint (host:port)
    description: >-
      The Locale cloud endpoint this add-on keeps a secure tunnel to for
      remote access (reaching your devices from the Locale app when away
      from home). Defaults to the Locale cloud and only activates after
      you connect this Home to the cloud from the app. Override only for
      dev/self-host.
  telemetry_forward:
    name: Forward telemetry to cloud
    description: >-
      Send device telemetry to the Locale cloud once this Home is connected
      from the iOS app. Turn off to keep telemetry entirely local — the add-on
      keeps recording either way, and turning it back on resumes from where it
      left off rather than skipping the gap.
  telemetry_retention_days:
    name: Keep telemetry for (days)
    description: >-
      How long this add-on keeps device telemetry on disk. Older records are
      deleted automatically. Set 0 to keep everything forever — only do that
      if you intend to archive it, since the log grows without limit.
