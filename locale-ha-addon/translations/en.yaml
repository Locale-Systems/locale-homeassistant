configuration:
  log_level:
    name: Log level
    description: >-
      Add-on logging verbosity. Whether this Home shares anything with
      Locale Cloud, firmware updates, the Tempest weather listener and device
      time are decided in the Locale app on the owner's phone, not here.
  platform_url:
    name: Platform URL (self-host)
    description: >-
      Locale cloud base URL for firmware updates. Leave blank for the Locale
      cloud default; change only for dev/self-host. Whether firmware updates
      run at all is decided in the Locale app.
  platform_mux_addr:
    name: Cloud tunnel endpoint (self-host, host:port)
    description: >-
      The Locale cloud endpoint the tunnel dials. Leave blank for the Locale
      cloud default; change only for dev/self-host. Whether the tunnel dials
      at all is the Home's Locale Cloud setting in the Locale app.
  sntp_advertise:
    name: NTP advertise override (host:port)
    description: >-
      Leave blank to use this host's LAN address automatically. Set it only
      if the automatic choice picks the wrong network interface — the value
      must be reachable from the devices, so never localhost. Only used
      while the Locale app has device time management on for this Home.
  weather_station_filter:
    name: Weather station filter (serial)
    description: >-
      Leave blank to collect every Tempest station heard on the network; set
      a station serial (e.g. "ST-00012345") to collect just that one. Only
      used while the Locale app has the weather listener on for this Home.
